<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1019" />
      <stop offset="100%" stop-color="#070a0f" />
    </linearGradient>

    <!-- Gradiente del marco cian/azul -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.9" />
    </linearGradient>

    <!-- Patrón de scanlines para tu retrato -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100%" y2="0" stroke="#070a0f" stroke-width="2" />
    </pattern>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
    }
    .key { fill: #38bdf8; font-weight: 600; }
    .val { fill: #94a3b8; }
    .hl  { fill: #34d399; }
    .sec { fill: #64748b; font-size: 11px; letter-spacing: 1.5px; }
  </style>

  <!-- Tarjeta principal -->
  <rect x="5" y="5" width="890" height="470" rx="16" fill="url(#card-bg)" stroke="url(#border-glow)" stroke-width="1.8" />

  <!-- ==================== CONTENEDOR DE RETRATO (IZQUIERDA) ==================== -->
  <g transform="translate(30, 35)">
    <!-- Marco de la foto -->
    <rect x="0" y="0" width="280" height="370" rx="10" fill="#040609" stroke="#1e293b" stroke-width="1.2" />

    <!-- 
      COMO PONER TU FOTO:
      Reemplaza el 'href' por la ruta de tu imagen (ej. "assets/tu-foto.png" o un Base64).
      El filtro de líneas horizontales se aplicará encima automáticamente.
    -->
    <image href="./asciify.png" x="10" y="10" width="260" height="350" preserveAspectRatio="xMidYMid slice" style="filter: grayscale(100%) contrast(140%) brightness(90%);" />

    <!-- Capa de scanlines (líneas de monitor CRT) -->
    <rect x="10" y="10" width="260" height="350" fill="url(#scanlines)" opacity="0.65" />
    <!-- Tinte cian sobre la foto -->
    <rect x="10" y="10" width="260" height="350" fill="#00f2fe" opacity="0.12" style="mix-blend-mode: screen;" />

    <!-- Etiqueta inferior -->
    <text x="5" y="400" class="mono sec" fill="#64748b">> USER_ID // AVATAR_PORTRAIT</text>
  </g>

  <!-- ==================== DATOS Y TERMINAL (DERECHA) ==================== -->
  <g transform="translate(350, 45)" class="mono">
    <!-- SECCIÓN: BIO -->
    <text x="0" y="20" class="sec">--- IDENTIFICATION ---</text>

    <text x="0" y="50" class="key">Subject</text>
    <text x="130" y="50" class="val">: Tu Nombre Aquí</text>

    <text x="0" y="75" class="key">Role</text>
    <text x="130" y="75" class="val">: Full-Stack Developer</text>

    <text x="0" y="100" class="key">Location</text>
    <text x="130" y="100" class="val">: Caracas, Venezuela</text>

    <text x="0" y="125" class="key">Status</text>
    <text x="130" y="125" class="hl">: Open to opportunities</text>

    <!-- SECCIÓN: STACK -->
    <text x="0" y="170" class="sec">--- SYSTEM CAPABILITIES ---</text>

    <text x="0" y="200" class="key">Languages</text>
    <text x="130" y="200" class="val">: JavaScript, Python, C++</text>

    <text x="0" y="225" class="key">Frontend</text>
    <text x="130" y="225" class="val">: React, TailwindCSS, Next.js</text>

    <text x="0" y="250" class="key">Backend</text>
    <text x="130" y="250" class="val">: Node.js, Express, REST APIs</text>

    <text x="0" y="275" class="key">Database</text>
    <text x="130" y="275" class="val">: PostgreSQL, MongoDB</text>

    <text x="0" y="300" class="key">ToolChain</text>
    <text x="130" y="300" class="val">: Git, Docker, VS Code, Linux</text>

    <!-- SECCIÓN: ENLACES -->
    <text x="0" y="345" class="sec">--- NETWORK NODES ---</text>

    <text x="0" y="375" class="key">Portfolio</text>
    <text x="130" y="375" class="val">: https://tu-sitio.dev</text>

    <text x="0" y="400" class="key">LinkedIn</text>
    <text x="130" y="400" class="val">: in/tu-usuario</text>

    <text x="0" y="425" class="key">GitHub</text>
    <text x="130" y="425" class="val">: github.com/tu-usuario</text>
  </g>
</svg>
